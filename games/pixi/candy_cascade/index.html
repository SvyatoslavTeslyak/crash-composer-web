<body>
<!-- The scene: between the kit's header and its bet panel, the cascade ladder and the board. -->
<main id="stage">
  <section id="play" aria-label="Candy Cascade">
    <!-- The cascade ladder: one slim row; each cluster's win shows on the board itself. -->
    <section class="hero" aria-label="Cascade multiplier">
      <div class="ladder-heading"><span class="cascade-title">CASCADE MULTIPLIER</span><span class="fgstrip" data-slot="strip" hidden></span></div>
      <div class="pills" data-slot="pills" aria-label="Cascade progress"></div>
    </section>
    <section class="board" data-slot="board" aria-label="Board"></section>
    <!-- Full-width stake row, then AUTO / TURBO / SPIN. -->
    <section class="slot-panel" aria-label="Bet controls">
      <div class="sp-row">
        <div class="sp-bet">
          <button class="sp-step sp-limit" data-action="min" aria-label="Minimum bet">MIN</button>
          <button class="sp-step" data-action="minus" aria-label="Lower bet">−</button>
          <div class="sp-val" aria-label="Bet amount"><b><span data-slot="bet"></span><img class="coin" src="crash-ui/assets/icons/coin.png" alt=""></b></div>
          <button class="sp-step" data-action="plus" aria-label="Raise bet">+</button>
          <button class="sp-step sp-limit" data-action="max" aria-label="Maximum affordable bet">MAX</button>
        </div>
        <div class="sp-toggles">
          <button class="sp-toggle" data-action="auto" data-slot="auto" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M18.5 2.8v4.4h-4.4M5.5 21.2v-4.4h4.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AUTO</span></button>
          <button class="sp-toggle" data-action="turbo" data-slot="turbo" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg><span>TURBO</span></button>
        </div>
        <button class="sp-spin" data-action="spin" data-slot="spin"></button>
      </div>
    </section>
  </section>
</main>
<script src="crash-ui/tokens.js?v=bd301bc1445c"></script>
