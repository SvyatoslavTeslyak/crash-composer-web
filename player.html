<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Lotomobil account · Goat Road</title><link rel="stylesheet" href="player.css"><script src="player-config.js" defer></script><script src="player.js" defer></script></head>
<body><main id="login"><div class="account"><p class="brand">LOTOMOBIL</p><h1>Log in to your account</h1><p>Play Goat Road with your Lotomobil account.</p><form id="credentials"><label>Phone number<input name="phone" type="tel" autocomplete="tel" required></label><label>PIN<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><button type="submit">Continue</button></form><form id="verification" hidden><label>Code sent to your phone<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]+" required></label><button type="submit">Log in & play</button><button id="back" type="button" class="secondary">Use another account</button></form><p id="status" role="status" aria-live="polite"></p></div></main><iframe id="game" title="Goat Road" allow="autoplay; fullscreen" allowfullscreen hidden></iframe></body></html>
